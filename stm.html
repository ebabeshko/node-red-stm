<script type="text/javascript">
    RED.nodes.registerType('stm',{
        category: 'sakura',
        color: "#edc6da",
        icon: "serial.png",
        defaults: {
            name: {value:""},
            kp: {value:"",required:true},
            bn: {value:"",required:true},
            btype: {value:"TI", required: true},
        },
        inputs:1,
        outputs:1,
        label: function() {
            return this.name||"stm read";
        }
    });
</script>

<script type="text/html" data-template-name="stm">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-kp"><i class="fa fa-link"></i> KP</label>
        <input type="text" id="node-input-kp" placeholder="KP">
    </div>   
    <div class="form-row">
        <label for="node-input-bn"><i class="fa fa-tags"></i> Board</label>
        <input type="text" id="node-input-bn" placeholder="Board">
    </div>  
	<div class="form-row">
		<label for="node-input-btype"><i class="fa fa-ticket"></i> Board Type</label>
		<select type="text" id="node-input-btype" placeholder="Board Type">
			<option value="TI">TI</option>
			<option value="TS">TS</option>
		</select>
	</div>
</script>

<script type="text/html" data-help-name="stm">
    <p>
        Reads data from the board.
    </p>

    <h3>Node Properties</h3>
    <dl class="message-properties">
        <dt>KP
            <span class="property-type">number</span>
        </dt>
        <dd>Station (KP) number.</dd>

        <dt>Board
           <span class="property-type">TI / TS</span>
	</dt>
        <dd>Board number to read.</dd>

        <dt>Board Type</dt>
        <dd>
            Type of the board:
            <ul>
                <li><b>TI</b> - Analog</li>
                <li><b>TS</b> - Digital</li>
            </ul>
        </dd>
    </dl>

    <h3>Input</h3>
    <p>
        Any incoming message triggers reading of the configured STM board.
    </p>

    <p>
        The node also supports the following optional input properties:
    </p>

    <dl class="message-properties">
        <dt>sysno <span class="property-type">any</span></dt>
        <dd>
            If this property exists, the output message will include
            <code>msg.sysno</code> containing the current STM system number.
        </dd>

        <dt>valid <span class="property-type">any</span></dt>
        <dd>
            If this property exists, the node checks data validity in the board and adds
            <code>msg.valid</code> to the output message.
            If board is offline, no message is sent.
        </dd>
    </dl>

    <h3>Output</h3>

    <dl class="message-properties">
        <dt>payload <span class="property-type">array</span></dt>
        <dd>
            Array containing all values read from the STM board.
        </dd>

        <dt class="optional">sysno <span class="property-type">number</span></dt>
        <dd>
            Current STM system number (only if requested).
        </dd>

        <dt class="optional">valid <span class="property-type">boolean</span></dt>
        <dd>
            Board status (only if requested).
        </dd>
    </dl>

    <h3>Details</h3>
    <p>
        The node automatically connects to the STM data source, reads the
        configured board, and disconnects after the operation completes.
    </p>

    <p>
        The returned array element type depends on the STM board type:
        unsigned integer, signed integer or floating-point values.
    </p>

    <h3>Errors</h3>

    <p>
        The node reports errors if:
    </p>

    <ul>
        <li>the STM data source cannot be attached;</li>
        <li>the STM API returns an error code;</li>
        <li>an unexpected exception occurs during processing.</li>
    </ul>
</script>
