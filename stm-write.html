<script type="text/javascript">
    RED.nodes.registerType('stm-write',{
        category: 'sakura',
        color: "#edc6da",
        icon: "font-awesome/fa-pencil",
        defaults: {
            name:   {value:""},
            kp:     {value:"", required:true},
            bn:     {value:"", required:true},
            idx:  {value:""},
            val:    {value:""}
        },
        inputs:1,
        outputs:1,
        label: function() {
            return this.name || "stm write";
        }
    });
</script>

<script type="text/html" data-template-name="stm-write">

    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> Name
        </label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>

    <div class="form-row">
        <label for="node-input-kp">
            <i class="fa fa-link"></i> KP
        </label>
        <input type="text" id="node-input-kp" placeholder="KP">
    </div>

    <div class="form-row">
        <label for="node-input-bn">
            <i class="fa fa-tags"></i> Board
        </label>
        <input type="text" id="node-input-bn" placeholder="Board">
    </div>

    <div class="form-row">
        <label for="node-input-idx">
            <i class="fa fa-hashtag"></i> Signal
        </label>
        <input type="text" id="node-input-idx" placeholder="1">
    </div>

    <div class="form-row">
        <label for="node-input-val">
            <i class="fa fa-bolt"></i> Value
        </label>
        <input type="text" id="node-input-val"
               placeholder="Value">
    </div>

</script>

<script type="text/html" data-help-name="stm-write">

<p>
    Writes value to the configured signal.
</p>

<h3>Configuration</h3>

<dl class="message-properties">

    <dt>KP
        <span class="property-type">number</span>
    </dt>
    <dd>
        KP number.
    </dd>

    <dt>Board
        <span class="property-type">number</span>
    </dt>
    <dd>
        Board number.
    </dd>

    <dt>Signal
        <span class="property-type">number</span>
    </dt>
    <dd>
        Signal Index. If not specified, 1 is used
    </dd>

    <dt>Value
        <span class="property-type">number</span>
    </dt>
    <dd>
        Value written when no value is supplied in the message.
    </dd>

</dl>

<h3>Input</h3>

<dl class="message-properties">

    <dt>msg.payload.kp
        <span class="property-type">number</span>
    </dt>
    <dd>
        Overrides the configured KP.
    </dd>

    <dt>msg.payload.bn
        <span class="property-type">number</span>
    </dt>
    <dd>
        Overrides the configured Board.
    </dd>

    <dt>msg.payload.idx
        <span class="property-type">number</span>
    </dt>
    <dd>
        Overrides the configured Signal.
    </dd>

    <dt>msg.payload.value
        <span class="property-type">number</span>
    </dt>
    <dd>
        Overrides the configured Value.
    </dd>

</dl>

<h3>Output</h3>

<p>
    The original message is passed through unchanged.
</p>

</script>
